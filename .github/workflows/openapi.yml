name: openapi

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  contract-compatibility:
    name: contract-compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base OpenAPI spec from target branch or previous commit
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TARGET_BRANCH="${{ github.base_ref }}"
            git fetch origin "${TARGET_BRANCH}" || true
            git show "origin/${TARGET_BRANCH}:lib/openapi.yaml" > base-openapi.yaml || cp lib/openapi.yaml base-openapi.yaml
          else
            git show "HEAD~1:lib/openapi.yaml" > base-openapi.yaml || cp lib/openapi.yaml base-openapi.yaml
          fi
      - uses: jdx/mise-action@v4
      - run: just install
      - name: Generate current OpenAPI spec
        run: pnpm openapi
      - name: Decide oasdiff fail-on
        id: oasdiff
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && ",${LABELS}," == *",breaking-change,"* ]]; then
            echo "fail_on=" >> "$GITHUB_OUTPUT"
            echo "breaking-change label present; reporting only"
          else
            echo "fail_on=ERR" >> "$GITHUB_OUTPUT"
          fi
      - name: Run oasdiff breaking change check
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: base-openapi.yaml
          revision: lib/openapi.yaml
          fail-on: ${{ steps.oasdiff.outputs.fail_on }}
