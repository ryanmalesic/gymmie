paths:
  /api/rpc/2026-08-28/CreateLocation:
    post:
      deprecated: false
      description: >-
        [Version Lock: 2026-08-28] Creates a location owned by the current user.
        Allowed for users with a complete profile and activated Stripe account.
      security:
        - bearerAuth: []
      summary: Create a location
      tags:
        - Locations
      requestBody:
        description: New location payload
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - CLOSED
                    - DRAFT
                    - ONBOARDING
                    - PAUSED
                    - PENDING
                    - REJECTED
                    - RESTRICTED
                    - SUSPENDED
                type:
                  type: string
                  enum:
                    - AQUATIC_CENTER
                    - BARRE_STUDIO
                    - BOUTIQUE_GYM
                    - BOXING_GYM
                    - CENTER
                    - CLIMBING_GYM
                    - COMBAT_GYM
                    - COMMERCIAL_GYM
                    - COMMUNITY_CENTER
                    - CROSSFIT_STUDIO
                    - GYM
                    - HOME_GYM
                    - HOTEL_GYM
                    - OTHER
                    - PILATES_STUDIO
                    - REHAB_CENTER
                    - SPIN_STUDIO
                    - STUDIO
                    - TRAINING_STUDIO
                    - UNIVERSITY_GYM
                    - YOGA_STUDIO
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                phone:
                  type: string
                  description: US phone number
                  example: +1 (415) 555-1234
                email:
                  type: string
                  description: Email address
                  example: ada@example.com
                  format: email
                website:
                  type: string
                  description: Secure HTTPS URL
                  example: https://example.com/image.png
                  format: uri
                addressLine1:
                  type: string
                  minLength: 1
                  maxLength: 255
                addressLine2:
                  type:
                    - string
                    - 'null'
                  maxLength: 255
                city:
                  type: string
                  minLength: 1
                  maxLength: 100
                state:
                  type: string
                  description: USPS state code
                  example: CA
                postalCode:
                  type: string
                  description: US ZIP code
                  example: '94107'
                country:
                  type: string
                  description: ISO 3166-1 alpha-2 country code
                  example: US
                timezone:
                  type: string
                  description: IANA time zone
                  example: America/New_York
                latitude:
                  type: number
                  description: Latitude in decimal degrees
                  example: 37.7749
                longitude:
                  type: number
                  description: Longitude in decimal degrees
                  example: -122.4194
              required:
                - type
                - name
                - phone
                - email
                - website
                - addressLine1
                - city
                - state
                - postalCode
                - latitude
                - longitude
              additionalProperties: false
      responses:
        '201':
          description: Created location record
          headers:
            x-rpc-command:
              description: Executed RPC command name
              schema:
                type: string
            x-rpc-version:
              description: Version lock timestamp
