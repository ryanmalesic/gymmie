services:
  test-db:
    image: citusdata/citus:18.0
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gymmie_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gymmie_test']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
